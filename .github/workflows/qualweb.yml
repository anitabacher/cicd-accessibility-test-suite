name: QualWeb Accessibility Scan
# QualWeb (University of Lisbon) - Focus on W3C ACT Rules

on:
  workflow_dispatch:
  push:
    branches: ['**']

env:
  TEST_URL: http://127.0.0.1:1338
  PORT: 1338

jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        view:
          - "" # index.html
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      # 2. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      - name: Install QualWeb & Puppeteer v22
        run: npm install @qualweb/core @qualweb/act-rules @qualweb/wcag-techniques puppeteer@22.15.0

      # 3. Build Project
      - name: Build Project
        run: npm run build --if-present

      # 4. Start Server
      - name: Start Server
        run: |
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npm start &
          echo "Waiting for server..."
          npx wait-on $TEST_URL

      # 5. Sanity Check
      # Testing if Puppeteer alone can load the page

      - name: Sanity Check (Raw Puppeteer)
        run: |
          TARGET_URL="$TEST_URL/${{ matrix.view }}"
          echo "Testing Puppeteer on: $TARGET_URL"
          
          cat <<EOF > test_puppeteer.js
          const puppeteer = require('puppeteer');
          (async () => {
            console.log("Starting Sanity Check...");
            try {
              const browser = await puppeteer.launch({
                headless: 'new',
                // using minimal stable flag-set for GitHub Actions
                args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--no-proxy-server']
              });
              const page = await browser.newPage();
              await page.goto('$TARGET_URL');
              const title = await page.title();
              console.log("✅ Sanity Check Success! Page Title found:", title);
              await browser.close();
            } catch (error) {
              console.error("❌ Sanity Check Failed:", error);
              process.exit(1);
            }
          })();
          EOF
          
          node test_puppeteer.js

      # 6. QualWeb Execution
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true
        run: |
          mkdir -p qualweb-results
          
          TARGET_URL="$TEST_URL/${{ matrix.view }}"
          echo "Scanning: $TARGET_URL"
          
          cat <<EOF > run_scan.js
          const { QualWeb } = require('@qualweb/core');
          const fs = require('fs');

          (async () => {
            const qualweb = new QualWeb();
          
            console.log("Launching QualWeb with clean config...");

            await qualweb.start(
              { maxConcurrency: 1, monitor: true },
              { 
                headless: 'new', // Muss matchen mit v22
          
                // Wir nutzen EXAKT dieselben Args wie im Sanity Check oben
                args: [
                  '--no-sandbox', 
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                  '--no-proxy-server'
                ],
                defaultViewport: { width: 1920, height: 1080 }
              }
            );

            console.log('Starting evaluation for: $TARGET_URL');
          
            try {
              const report = await qualweb.evaluate({
                urls: ['$TARGET_URL'],
                execute: {
                  act: true,
                  wcag: true
                },
                waitUntil: ['load']
              });

              const viewName = "${{ matrix.view }}" || "home";
              const fileName = \`qualweb-results/qualweb-\${viewName}.json\`;
          
              const keys = Object.keys(report);
              console.log(\`Report generated with \${keys.length} URL keys.\`);

              if (keys.length === 0) {
                console.error("WARNING: Report object is empty!");
              }

              fs.writeFileSync(fileName, JSON.stringify(report, null, 2));
              console.log('Report saved to ' + fileName);
          
            } catch (error) {
              console.error("FATAL ERROR inside QualWeb script:", error);
            }

            await qualweb.stop();
          })();
          EOF

          node run_scan.js

      # 7. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json