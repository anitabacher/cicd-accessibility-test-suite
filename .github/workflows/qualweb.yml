name: QualWeb Accessibility Scan
# QualWeb (University of Lisbon) - WCAG Focus

on:
  workflow_dispatch:
  push:
    branches: ['**']

env:
  TEST_URL: http://127.0.0.1:1338
  PORT: 1338


jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        view:
          - "" # index.html
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      # 3. Install Dependencies
      - name: Install QualWeb & Puppeteer
        run: |
          npm ci
          npm install @qualweb/core @qualweb/act-rules @qualweb/wcag-techniques puppeteer@21.11.0

      # 4. Build Project
      - name: Build Project
        run: npm run build --if-present

      # 5. Start Server
      - name: Start Server
        run: |
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npm start &
          echo "Waiting for server..."
          npx wait-on $TEST_URL

      # 6. Run QualWeb
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true
        run: |
          mkdir -p qualweb-results
          
          export TARGET_URL="$TEST_URL/${{ matrix.view }}"
          echo "Scanning: $TARGET_URL"
          
          cat << 'EOF' > run_scan.js
          const { start, evaluate, close } = require('@qualweb/core');
          const fs = require('fs');

          (async () => {
            const targetUrl = process.env.TARGET_URL;
            console.log("Launching QualWeb (Functional API)...");

            try {
              // 1. Start Browser
              await start(
                { 
                  maxConcurrency: 1, 
                  monitor: true 
                },
                { 
                  headless: 'new', 
                  args: [
                    '--no-sandbox', 
                    '--disable-setuid-sandbox',
                    '--disable-dev-shm-usage', 
                    '--no-proxy-server',
                    '--disable-gpu'
                  ]
                }
              );

              console.log('Browser started. Evaluating: ' + targetUrl);
          
              // 2. Evaluate
              const report = await evaluate({
                urls: [targetUrl],
                execute: {
                  act: false, 
                  wcag: true  
                },
                waitUntil: ['load'],
                bypassCSP: true
              });

              // Filename logic
              const urlParts = targetUrl.split('/');
              let viewName = urlParts[urlParts.length - 1];
              if (!viewName || viewName.includes(':')) viewName = "home";
              const fileName = `qualweb-results/qualweb-${viewName}.json`;
          
              const keys = Object.keys(report);
              console.log(`Report generated with ${keys.length} URL keys.`);

              if (keys.length === 0) {
                console.error("WARNING: Report is empty! (Even with API Fix)");
              } else {
                fs.writeFileSync(fileName, JSON.stringify(report, null, 2));
                console.log('Report saved to ' + fileName);
              }

              // 3. Using close to finish the Evaluation
              await close();
          
            } catch (error) {
              console.error("FATAL ERROR inside QualWeb script:", error);
              try { await close(); } catch(e) {}
              process.exit(1);
            }
          })();
          EOF

          node run_scan.js

      # 7. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json