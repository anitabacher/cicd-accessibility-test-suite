name: QualWeb Accessibility Scan
# QualWeb (University of Lisbon) - Focus on W3C ACT Rules
on:
  # to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches: ['**']


env:
  # Port and Url for the running web app
  TEST_URL: http://localhost:1338
  PORT: 1338

jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        view:
                - "" # index.html
                - "perceivable.html"
                - "operable.html"
                - "understandable.html"
                - "robust.html"
                - "dictionary.html"

    steps:
      # 1. Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: 18.x

      # 2. Install Dependencies
      - name: Install Dependencies
        run: npm ci
        # Install locally to avoid the "use strict" error
      - name: Install QualWeb CLI
        run: npm install @qualweb/cli

      # 3. Build Project
      - name: Build Project
        run: npm run build --if-present

      # 4. Start Server
      - name: Start Server
        run: |
          npm start &
          echo "Waiting for server..."
          npx wait-on $TEST_URL

      # 5. Qualweb Testing
      # with W3C Accessibility Conformance Testing rules
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true # important to get findings even when errors occur.
        run: |
          mkdir -p qualweb-results
            
          FULL_URL="$TEST_URL/${{ matrix.view }}"
          echo "Testing URL: $FULL_URL"
          
          node ./node_modules/.bin/qw -u "$FULL_URL" \
            -m act-rules wcag-techniques \
            --save-name "qualweb-report-${{ matrix.view || 'home' }}" \
            --dir qualweb-results || true
        

        # 6. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json
