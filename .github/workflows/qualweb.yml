name: QualWeb Accessibility Scan
# QualWeb (University of Lisbon) - WCAG Focus

on:
  workflow_dispatch:
  push:
    branches: ['**']

env:
  TEST_URL: http://127.0.0.1:1338
  PORT: 1338
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        view:
          - "" # index.html
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Setup Code
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      # Installing clean Chrome to avoid Snap problems
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 2. Install Dependencies
      - name: Install Dependencies
        run: |
          npm ci
          npm install @qualweb/core @qualweb/act-rules @qualweb/wcag-techniques

      # 3. Build Project
      - name: Build Project
        run: npm run build --if-present

      # 4. Start Server
      - name: Start Server
        run: |
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npm start &
          echo "Waiting for server..."
          npx wait-on $TEST_URL

      # 5. Run QualWeb
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true
        run: |
          mkdir -p qualweb-results
          
          export TARGET_URL="$TEST_URL/${{ matrix.view }}"
          echo "Scanning: $TARGET_URL"
          
          # Wir übergeben den Pfad aus der Action an das Skript
          export CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}" || "$CHROME_PATH"
          
          cat << 'EOF' > run_scan.js
          const { QualWeb } = require('@qualweb/core');
          const fs = require('fs');

          (async () => {
            const qualweb = new QualWeb();
            const targetUrl = process.env.TARGET_URL;
            const chromePath = process.env.CHROME_PATH; // Hier kommt der Pfad an

            console.log("Launching QualWeb using SETUP-CHROME binary...");
            console.log("Path: " + chromePath);

            await qualweb.start(
              { 
                maxConcurrency: 1, 
                monitor: true 
              },
              { 
                headless: 'new', // Modernes Headless funktioniert hier super
                executablePath: chromePath, // Zwingende Pfad-Angabe
                args: [
                  '--no-sandbox', 
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage', 
                  '--no-proxy-server'
                ]
              }
            );

            console.log('Starting evaluation for: ' + targetUrl);
          
            try {
              const report = await qualweb.evaluate({
                urls: [targetUrl],
                execute: {
                  act: false, // Ressourcen sparen
                  wcag: true  // Fokus der Arbeit
                },
                // 'load' ist der Sweetspot zwischen Bildern und Timeout
                waitUntil: ['load'],
                bypassCSP: true
              });

              // Filename logic
              const urlParts = targetUrl.split('/');
              let viewName = urlParts[urlParts.length - 1];
              if (!viewName || viewName.includes(':')) viewName = "home";
              const fileName = `qualweb-results/qualweb-${viewName}.json`;
          
              const keys = Object.keys(report);
              console.log(`Report generated with ${keys.length} URL keys.`);

              if (keys.length === 0) {
                console.error("WARNING: Report object is empty!");
              }

              fs.writeFileSync(fileName, JSON.stringify(report, null, 2));
              console.log('Report saved to ' + fileName);
          
            } catch (error) {
              console.error("FATAL ERROR inside QualWeb script:", error);
              process.exit(1);
            }

            await qualweb.stop();
          })();
          EOF

          node run_scan.js

      # 6. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json