name: QualWeb Accessibility Scan
# QualWeb (University of Lisbon) - Focus on W3C ACT Rules
# not yet updated repository: https://github.com/qualweb/qualweb/blob/main/packages/cli/README.md
on:
  workflow_dispatch:
  push:
    branches: ['**']

env:
  TEST_URL: http://localhost:1338
  PORT: 1338

jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        view:
          - "" # index.html
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      # 2. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Install Core Engine due to CLI Version not working properly
      - name: Install QualWeb Core
        run: npm install @qualweb/core

      # 3. Build Project
      - name: Build Project
        run: npm run build --if-present

      # 4. Start Server
      - name: Start Server
        run: |
          npm start &
          echo "Waiting for server..."
          npx wait-on $TEST_URL

      # 5. QualWeb Execution
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true
        run: |
          mkdir -p qualweb-results
          
          TARGET_URL="$TEST_URL/${{ matrix.view }}"
          echo "Scanning: $TARGET_URL"
          
          # Creating script for sandbox handling
          cat <<EOF > run_scan.js
          const { QualWeb } = require('@qualweb/core');
          const fs = require('fs');

          (async () => {
            const qualweb = new QualWeb();
        
            await qualweb.start({
              launchOptions: {
                args: ['--no-sandbox', '--disable-setuid-sandbox']
              }
            });

            console.log('Starting evaluation for: $TARGET_URL');
          
            const report = await qualweb.evaluate({
              url: '$TARGET_URL',
              execute: {
                act: true,
                wcag: true
              }
            });

            const viewName = "${{ matrix.view }}" || "home";
            // Escaping für Template Literals in der Shell
            const fileName = \`qualweb-results/qualweb-\${viewName}.json\`;
          
            fs.writeFileSync(fileName, JSON.stringify(report, null, 2));
            console.log('Report saved to ' + fileName);

            await qualweb.stop();
          })();
          EOF

          node run_scan.js

      # 6. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json