name: QualWeb Accessibility Scan
# QualWeb (University of Lisbon) - Focus on W3C ACT Rules
# FIX: Hardcoded IPv4 (127.0.0.1) and Headless 'New' mode

on:
  workflow_dispatch:
  push:
    branches: ['**']

env:
  # WICHTIG: Kein 'localhost' mehr! Wir erzwingen IPv4.
  TEST_URL: http://127.0.0.1:1338
  PORT: 1338

jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        view:
          - "" # index.html
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      # 2. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Rules explicitly installed
      - name: Install QualWeb Core & Rules
        run: npm install @qualweb/core @qualweb/act-rules @qualweb/wcag-techniques

      # 3. Build Project
      - name: Build Project
        run: npm run build --if-present

      # 4. Start Server
      - name: Start Server
        run: |
          # Wir setzen die Node-Optionen, um IPv4 zu bevorzugen
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npm start &
          echo "Waiting for server..."
          npx wait-on $TEST_URL

      # 5. Verify Connection (CRUCIAL DEBUG STEP)
      # Wir testen jetzt explizit die IP 127.0.0.1
      # Wenn das hier fehlschlägt, wissen wir, dass der Server nur IPv6 spricht.
      - name: Verify Server Connection
        run: |
          echo "Testing connection to ${{ env.TEST_URL }}/${{ matrix.view }}"
          curl -v "${{ env.TEST_URL }}/${{ matrix.view }}" || exit 1

      # 6. QualWeb Execution
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true
        run: |
          mkdir -p qualweb-results
          
          TARGET_URL="$TEST_URL/${{ matrix.view }}"
          echo "Scanning: $TARGET_URL"
          
          cat <<EOF > run_scan.js
          const { QualWeb } = require('@qualweb/core');
          const fs = require('fs');

          (async () => {
            const qualweb = new QualWeb();
          
            console.log("Launching QualWeb with IPv4 target and Headless 'New'...");

            await qualweb.start(
              { maxConcurrency: 1, monitor: true },
              { 
                // FIX: using 'new' as a modern Headless-Mode
                headless: 'new',
          
                // security setting
                ignoreHTTPSErrors: true,

                args: [
                  '--no-sandbox', 
                  '--disable-setuid-sandbox',
                  '--disable-gpu',
                  '--disable-dev-shm-usage',
                  '--disable-web-security' // Hilft bei lokalen Netzwerk-Problemen
                ],
                defaultViewport: { width: 1920, height: 1080 }
              }
            );

            console.log('Starting evaluation for: $TARGET_URL');
          
            try {
              const report = await qualweb.evaluate({
                urls: ['$TARGET_URL'],
                execute: {
                  act: true,
                  wcag: true
                },
                waitUntil: ['domcontentloaded']
              });

              const viewName = "${{ matrix.view }}" || "home";
              const fileName = \`qualweb-results/qualweb-\${viewName}.json\`;
          
              const keys = Object.keys(report);
              console.log(\`Report generated with \${keys.length} URL keys.\`);

              if (keys.length === 0) {
                console.error("WARNING: Report object is empty! Check logs above.");
              }

              fs.writeFileSync(fileName, JSON.stringify(report, null, 2));
              console.log('Report saved to ' + fileName);
          
            } catch (error) {
              console.error("FATAL ERROR inside QualWeb script:", error);
            }

            await qualweb.stop();
          })();
          EOF

          node run_scan.js

      # 7. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json