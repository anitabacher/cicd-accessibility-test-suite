name: QualWeb Accessibility Scan
# QualWeb (University of Lisbon) - Focus on W3C ACT Rules

on:
  workflow_dispatch:
  push:
    branches: ['**']

env:
  TEST_URL: http://127.0.0.1:1338
  PORT: 1338

jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        view:
          - "" # index.html
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      # 2. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Install specific Puppeteer version (v22 is stable)
      - name: Install QualWeb & Puppeteer v22
        run: npm install @qualweb/core @qualweb/act-rules @qualweb/wcag-techniques puppeteer@22.15.0

      # 3. Build Project
      - name: Build Project
        run: npm run build --if-present

      # 4. Start Server
      - name: Start Server
        run: |
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npm start &
          echo "Waiting for server..."
          npx wait-on $TEST_URL

      # 5. Sanity Check
      - name: Sanity Check (Raw Puppeteer)
        run: |
          TARGET_URL="$TEST_URL/${{ matrix.view }}"
          cat <<EOF > test_puppeteer.js
          const puppeteer = require('puppeteer');
          (async () => {
            try {
              const browser = await puppeteer.launch({
                headless: 'new',
                args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--no-proxy-server']
              });
              const page = await browser.newPage();
              await page.goto('$TARGET_URL');
              console.log("✅ Sanity Check Passed: " + await page.title());
              await browser.close();
            } catch (e) { console.error("❌ Sanity Check Failed:", e); process.exit(1); }
          })();
          EOF
          node test_puppeteer.js

      # 6. QualWeb Execution
      # WICHTIG: Die Einrückung muss genau auf der gleichen Höhe sein wie bei Schritt 5!
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true
        run: |
          mkdir -p qualweb-results
          
          export TARGET_URL="$TEST_URL/${{ matrix.view }}"
          echo "Scanning: $TARGET_URL"
          
          # Wir nutzen 'EOF' in Quotes, um Syntaxfehler mit der Shell zu vermeiden
          cat << 'EOF' > run_scan.js
          const { QualWeb } = require('@qualweb/core');
          const puppeteer = require('puppeteer'); 
          const fs = require('fs');

          (async () => {
            const qualweb = new QualWeb();
            const targetUrl = process.env.TARGET_URL;

            console.log("Launching QualWeb (Config matches Sanity Check)...");

            await qualweb.start(
              { 
                maxConcurrency: 1, 
                monitor: true,
                puppeteer: puppeteer 
              },
              { 
                // WICHTIG: Wir nutzen dieselben Settings wie im Sanity Check (der funktioniert hat!)
                headless: 'new',
                args: [
                  '--no-sandbox', 
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage', 
                  '--no-proxy-server'
                ],
                defaultViewport: { width: 1920, height: 1080 }
              }
            );

            console.log('Starting evaluation for: ' + targetUrl);
          
            try {
              const report = await qualweb.evaluate({
                urls: [targetUrl],
                execute: {
                  act: true,
                  wcag: true
                },
                // Load = Bilder werden geladen. 
                // Kein 'networkidle', damit der Server die Verbindung offen halten darf.
                waitUntil: ['load'],
                bypassCSP: true
              });

              const urlParts = targetUrl.split('/');
              let viewName = urlParts[urlParts.length - 1];
              if (!viewName || viewName.includes(':')) viewName = "home";
              const fileName = `qualweb-results/qualweb-${viewName}.json`;
          
              const keys = Object.keys(report);
              console.log(`Report generated with ${keys.length} URL keys.`);

              if (keys.length === 0) {
                console.error("WARNING: Report object is empty!");
              }

              fs.writeFileSync(fileName, JSON.stringify(report, null, 2));
              console.log('Report saved to ' + fileName);
          
            } catch (error) {
              console.error("FATAL ERROR inside QualWeb script:", error);
              process.exit(1);
            }

            await qualweb.stop();
          })();
          EOF

          node run_scan.js

      # 7. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json