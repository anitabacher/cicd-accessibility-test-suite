name: QualWeb Accessibility Scan

on:
  push:
    branches:
      - "feature/**"
      - "main"
  workflow_dispatch:

env:
  TEST_URL: http://localhost:1338

jobs:
  qualweb-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page:
          - "index.html"
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          npm ci
          npm install -g wait-on
          npm install \
            @qualweb/core@0.8.6 \
            @qualweb/act-rules@0.7.5 \
            @qualweb/wcag-techniques@0.4.2 \
            puppeteer@24.37.2 \
            wait-on@8.0.3 \
            chromedriver@136.0.3 \
            express@4.18.2 \
            serve@14.2.5

      # 4. Start Server and wait
      - name: Start Server
        run: |
          npm start &
          npx wait-on $TEST_URL

      # 5. QualWeb Scan
      - name: Run QualWeb on ${{ matrix.page }}
        run: |
          mkdir -p qualweb-results
          export TARGET_URLS="$TEST_URL/${{ matrix.page }}"
          node run_scan.js

      # 6. Testing
      - name: Check for Accessibility Violations on ${{ matrix.page }}
        run: |
          REPORT="qualweb-results/qualweb-${{ matrix.page }}.json"
          FAILURES=$(jq '[.. | objects | select(.outcome == "failed")] | length' $REPORT)
          echo "Found Violations ${{ matrix.page }}: $FAILURES"
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES accessibility violations have been found!"
            exit 1
          else
            echo "::notice::No failures on ${{ matrix.page }}!"
          fi

      # 7. Reports hochladen
      - name: Upload Report for ${{ matrix.page }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-report-${{ matrix.page }}
          path: qualweb-results/qualweb-${{ matrix.page }}.json
