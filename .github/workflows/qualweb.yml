name: QualWeb Accessibility Scan

on:
  workflow_dispatch:
  push:
    branches: ['**']

env:
  TEST_URL: http://127.0.0.1:1338
  PORT: 1338

jobs:
  qualweb-scan:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        view:
          - ""
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Chromium Dependencies
      - name: Install Chromium Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates fonts-liberation libasound2 \
            libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 \
            libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 \
            libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 \
            libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 \
            libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxss1 libxtst6 xdg-utils

      # 4. Install Dependencies
      - name: Install Dependencies
        run: |
          npm install \
            puppeteer@21.11.0 \
            @qualweb/core \
            @qualweb/act-rules \
            @qualweb/wcag-techniques \
            wait-on

      # 5. Build
      - name: Build Project
        run: npm run build --if-present

      # 6. Start Server
      - name: Start Server
        run: |
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npm start &
          npx wait-on --timeout 60000 $TEST_URL

      # 7. Run QualWeb
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true
        run: |
          mkdir -p qualweb-results
          export TARGET_URL="$TEST_URL/${{ matrix.view }}"
          node run_scan.js

      # 8. Upload Results
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualweb-results-${{ strategy.job-index }}
          path: qualweb-results/*.json
