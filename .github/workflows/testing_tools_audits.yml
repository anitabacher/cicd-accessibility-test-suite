name: Web Accessibility Testing Tools Results
# This workflow runs QualWeb, Axe-Core, Accessibility-checker and HTML_Codesniffer
# on all web pages of our test website and saves the results as github artifacts.

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  # Url for the running web app
  APP: http://localhost:1338

jobs:
  #================================================================================================
  # QUALWEB
  #================================================================================================
  qualweb:
    runs-on: ubuntu-22.04 # downgrade due to conflicts with CI
    strategy:
      fail-fast: false # ensure scan of pages even if one fails
      matrix:
        view:
          - "" # index.html
          - "perceivable.html"
          - "operable.html"
          - "understandable.html"
          - "robust.html"
          - "dictionary.html"

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # due to dependency issues with Puppeteer

      # 3. Install NPM dependencies (QualWeb core, Puppeteer, etc.)
      - name: Install Dependencies
        run: npm install

      # 4. Build (if a script exists)
      - name: Build Project
        run: npm run build --if-present

      # 5. Start local test server
      # Forcing IPv4 resolution order due to problems with the connection timeouts on localhost.
      # also using 'wait-on' for a fully responsive server before the scan begins.
      - name: Start Server
        run: |
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npm start &
          echo "Waiting for server..."
          npx wait-on --timeout 60000 $APP 

      # 6. Run custom scan script
      - name: Run QualWeb on ${{ matrix.view }}
        continue-on-error: true # to get results even if there are accessibility violations.
        env:
          TARGET_URL: ${{ env.APP }}/${{ matrix.view }}
        run: |
          node qualweb_scan.js

      # 7. Upload json reports as artifacts
      - name: Upload QualWeb Results
        uses: actions/upload-artifact@v4
        if: always() # Always upload reports, even if the scan found errors
        with:
          name: qualweb-json-results-${{ strategy.job-index }}
          path: qualweb-results/*.json



  #================================================================================================
  # AXE-CORE
  # Refactored to resolve version conflicts and 404 errors found in earlier runs.
  #================================================================================================
  axe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        webpage: [perceivable, operable, understandable, robust]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci

      - name: Start Test Server
        run: npm start & npx wait-on $APP

      - name: Run Axe-Core Scan
        run: |
          mkdir -p results/axe
          npx axe "$APP/${{ matrix.webpage }}.html" \
            --chromedriver-path ./node_modules/.bin/chromedriver \
            --chrome-options="no-sandbox,disable-dev-shm-usage,headless,disable-gpu" \
            --save results/axe/axe-results-${{ matrix.webpage }}.json
      - name: Archive axe-core test results
        uses: actions/upload-artifact@v4
        with:
          name: Axe-core-${{ matrix.webpage }}
          path: results/axe/axe-results-${{ matrix.webpage }}.json

  #================================================================================================
  # ACHECKER (IBM)
  #================================================================================================
  achecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build --if-present
      - run: npm start & npx wait-on $APP
      - name: Run accessibility-checker
        run: |
          npm install accessibility-checker
          bash test.bash run achecker $APP
      - name: Archive accessibility-checker test results
        # if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Accessibility-checker
          path: results/achecker/*

  #================================================================================================
  # HTMLCS
  #================================================================================================
  htmlcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build --if-present
      - run: npm start & npx wait-on $APP
      - name: Run HTML_CodeSniffer
        run: |
          npm i --save html_codesniffer
          cd node_modules/html_codesniffer
          npm install
          cd ../..
          npm i puppeteer
          bash test.bash run htmlcs $APP
      - name: Archive HTML_CodeSniffer test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTML_CodeSniffer
          path: results/HTML_CodeSniffer/*

  #================================================================================================
  # WAVE
  #================================================================================================
  wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install curl and jq
        run: sudo apt-get install -y curl jq
      - name: Run WAVE API on All Pages
        env:
          APP: https://robinkxl.github.io/thesis-project
          WAVE_API_KEY: ${{ secrets.WAVE_API_KEY }}
        run: |
          mkdir -p results/wave
          PAGES=("index" "perceivable" "operable" "understandable" "robust")
          for PAGE in "${PAGES[@]}"; do
            echo "Scanning $APP/$PAGE"
            curl -s "https://wave.webaim.org/api/request?key=$WAVE_API_KEY&reporttype=3&url=$APP/$PAGE" \
              -o "results/wave/wave-${PAGE}.json"
          done
      - name: Archive WAVE API results
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-All
          path: results/wave/*.json

  #================================================================================================
  # LIGHTHOUSE
  #================================================================================================
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./.lighthouserc.js   # change to just lighthouse
      - name: Archive Lighthouse CI results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lighthouse
          path: results/Lighthouse/*  # Be specific about file extension
          if-no-files-found: warn

  #================================================================================================
  # PA11Y
  # will cause the workflow to fail if any violations are found, on exit code 2.
  #================================================================================================
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chrome browser-action
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 124
          install-chromedriver: true
          install-dependencies: true
      - run: npm ci
      - run: npm run build --if-present
      - run: npm start & npx wait-on $APP
      - name: Install pa11y-ci
        run: npm install -g pa11y-ci
      - name: Run pa11y-ci
        run: bash test.bash run pa11y $APP
      - name: Archive Pa11y test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pa11y
          path: results/Pa11y/*